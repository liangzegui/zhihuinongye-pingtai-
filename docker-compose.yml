# =============================================
# 智慧农业监控平台 - Docker Compose 一键部署
# 使用方式: docker-compose up -d
# =============================================
version: '3.8'

services:
  # ========== MySQL 数据库 ==========
  mysql:
    image: mysql:8.0
    container_name: agri-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-agri_secure_2024}
      MYSQL_DATABASE: agri_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"    # 映射到 3307 避免与本地 MySQL 冲突
    volumes:
      - mysql-data:/var/lib/mysql
      - ./huawei-cloud/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql  # 自动初始化
    networks:
      - agri-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Spring Boot 后端 ==========
  backend:
    build:
      context: ./idea/agri-backend
      dockerfile: Dockerfile
    container_name: agri-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 数据库连接（使用Docker内部网络地址）
      DATABASE_URL: jdbc:mysql://mysql:3306/agri_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-agri_secure_2024}
      # 服务端口
      PORT: 8080
      # CORS 允许前端地址
      CORS_ORIGINS: http://localhost:8081,http://frontend:80
      # 华为云 IoTDA（部署时通过环境变量覆盖）
      IOTDA_AK: ${IOTDA_AK:-}
      IOTDA_SK: ${IOTDA_SK:-}
      IOTDA_ENDPOINT: ${IOTDA_ENDPOINT:-}
      IOTDA_PROJECT_ID: ${IOTDA_PROJECT_ID:-}
      IOTDA_DEVICE_ID: ${IOTDA_DEVICE_ID:-}
      IOTDA_INSTANCE_ID: ${IOTDA_INSTANCE_ID:-}
      # ESP32 地址
      ESP32_BASE_URL: ${ESP32_BASE_URL:-http://192.168.2.92}
      # JVM 参数
      JAVA_OPTS: -Xms256m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    networks:
      - agri-network

  # ========== Vue 前端（Nginx 静态托管）==========
  frontend:
    build:
      context: ./vue/agri-frontend
      dockerfile: Dockerfile
    container_name: agri-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8081:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf  # 自定义 Nginx 配置
    networks:
      - agri-network

# ========== 数据卷 ==========
volumes:
  mysql-data:
    driver: local

# ========== 网络 ==========
networks:
  agri-network:
    driver: bridge
