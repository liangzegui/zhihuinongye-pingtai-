# 服务器端口配置
server.port=${PORT:8080}

# 数据库配置（支持环境变量覆盖）
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/agri_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:sjk1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Session超时时间30分钟
server.servlet.session.timeout=1800

# 允许跨域的前端地址（生产环境设置）
cors.allowed-origins=${CORS_ORIGINS:http://localhost:8081}
