# 服务器端口配置
server.port=${PORT:8080}

# 数据库配置（支持环境变量覆盖）
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/agri_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:sjk1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Session超时时间30分钟
server.servlet.session.timeout=1800

# 允许跨域的前端地址（生产环境设置）
cors.allowed-origins=${CORS_ORIGINS:http://localhost:8081}

# ========================================
# 华为云IoTDA配置（直连模式）
# ========================================
# IoTDA接入地址（根据您的区域选择）
# 华南-广州: https://iotda.cn-south-1.myhuaweicloud.com
# 华北-北京: https://iotda.cn-north-4.myhuaweicloud.com
iotda.endpoint=${IOTDA_ENDPOINT:https://iotda.cn-south-1.myhuaweicloud.com}

# 华为云项目ID（在"我的凭证"中查看）
iotda.project-id=${IOTDA_PROJECT_ID:}

# AK/SK认证（部署时通过环境变量覆盖，请勿提交真实密钥）
iotda.access-key=${IOTDA_AK:}
iotda.secret-key=${IOTDA_SK:}

# ESP32设备ID
iotda.device-id=${IOTDA_DEVICE_ID:}

# IoTDA实例ID
iotda.instance-id=${IOTDA_INSTANCE_ID:}

# ESP32 本地HTTP网关地址
esp32.base-url=${ESP32_BASE_URL:http://192.168.2.7}

# ========================================
# Swagger/OpenAPI 接口文档配置
# ========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Webhook认证Token（留空则不校验）
iotda.webhook-token=${IOTDA_WEBHOOK_TOKEN:}
