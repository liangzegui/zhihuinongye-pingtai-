<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48">
  <!-- 太阳中心 -->
  <circle cx="50" cy="50" r="22" fill="#f7ba2a"/>
  
  <!-- 太阳光芒 -->
  <line x1="50" y1="8" x2="50" y2="20" stroke="#f7ba2a" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="80" x2="50" y2="92" stroke="#f7ba2a" stroke-width="4" stroke-linecap="round"/>
  <line x1="8" y1="50" x2="20" y2="50" stroke="#f7ba2a" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="50" x2="92" y2="50" stroke="#f7ba2a" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 斜向光芒 -->
  <line x1="20" y1="20" x2="29" y2="29" stroke="#f7ba2a" stroke-width="3" stroke-linecap="round"/>
  <line x1="71" y1="71" x2="80" y2="80" stroke="#f7ba2a" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="20" x2="71" y2="29" stroke="#f7ba2a" stroke-width="3" stroke-linecap="round"/>
  <line x1="29" y1="71" x2="20" y2="80" stroke="#f7ba2a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 太阳中心高光 -->
  <circle cx="43" cy="43" r="6" fill="white" opacity="0.4"/>
</svg>
