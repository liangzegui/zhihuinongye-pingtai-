  <ellipse cx="40" cy="26" rx="4" ry="7" fill="url(#wheatGrad)" transform="rotate(30 40 26)"/>
  <ellipse cx="41" cy="35" rx="3.5" ry="6" fill="url(#wheatGrad)" transform="rotate(35 41 35)"/>
