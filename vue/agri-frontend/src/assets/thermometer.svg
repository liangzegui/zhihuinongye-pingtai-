  <line x1="25" y1="30" x2="20" y2="30" stroke="#666" stroke-width="1.5"/>
  <line x1="25" y1="45" x2="20" y2="45" stroke="#666" stroke-width="1.5"/>
  <line x1="25" y1="60" x2="20" y2="60" stroke="#666" stroke-width="1.5"/>
