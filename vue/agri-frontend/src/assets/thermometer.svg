  <line x1="75" y1="45" x2="82" y2="45" stroke="#409eff" stroke-width="2"/>
  <line x1="75" y1="60" x2="80" y2="60" stroke="#409eff" stroke-width="2"/>
  <line x1="75" y1="75" x2="82" y2="75" stroke="#409eff" stroke-width="2"/>
